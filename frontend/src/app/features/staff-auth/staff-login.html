<main class="min-h-screen bg-[#071f29] text-[#103f4c] lg:grid lg:grid-cols-[minmax(0,1.08fr)_minmax(430px,0.92fr)]">
  <section class="relative min-h-[270px] overflow-hidden bg-[#0a2c38] lg:min-h-screen" aria-label="Không gian ClinicOne">
    <div class="absolute inset-0 grid grid-cols-[1.15fr_0.85fr] grid-rows-3 gap-2 p-2 sm:gap-3 sm:p-4 lg:gap-4 lg:p-6">
      <div class="row-span-3 overflow-hidden rounded-[1.75rem] bg-[#123f4b] shadow-2xl shadow-black/20">
        <img src="staff-login/operations-desk.webp" alt="Bàn điều phối tại phòng khám" class="h-full w-full object-cover transition duration-700 hover:scale-[1.03]" />
      </div>
      <div class="overflow-hidden rounded-[1.75rem] bg-[#123f4b] shadow-2xl shadow-black/20">
        <img src="staff-login/clinic-corridor.webp" alt="Hành lang phòng khám" class="h-full w-full object-cover transition duration-700 hover:scale-[1.03]" />
      </div>
      <div class="overflow-hidden rounded-[1.75rem] bg-[#123f4b] shadow-2xl shadow-black/20">
        <img src="staff-login/coordination-room.webp" alt="Khu vực điều phối khám bệnh" class="h-full w-full object-cover transition duration-700 hover:scale-[1.03]" />
      </div>
      <div class="overflow-hidden rounded-[1.75rem] bg-[#123f4b] shadow-2xl shadow-black/20">
        <img src="staff-login/clinic-lobby.webp" alt="Sảnh tiếp đón phòng khám" class="h-full w-full object-cover transition duration-700 hover:scale-[1.03]" />
      </div>
    </div>
    <div class="pointer-events-none absolute inset-0 bg-gradient-to-tr from-[#061a22]/50 via-transparent to-white/10"></div>
    <div class="absolute bottom-6 left-6 hidden items-center gap-3 text-white/80 sm:flex lg:bottom-10 lg:left-10">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-white/15 ring-1 ring-white/20 backdrop-blur">
        <mat-icon class="text-[20px]">domain</mat-icon>
      </span>
      <span class="text-xs font-semibold uppercase tracking-[0.18em]">ClinicOne operations</span>
    </div>
  </section>

  <section class="relative flex min-h-[calc(100vh-270px)] flex-col bg-[#f8fbfc] lg:min-h-screen">
    <header class="flex items-center justify-between px-6 py-6 sm:px-10 lg:px-14 lg:py-8">
      <a routerLink="/home" class="flex items-center gap-3" aria-label="ClinicOne, trang chủ">
        <img class="h-10 w-10 object-contain" src="clinicone-mark.png" alt="" aria-hidden="true" />
        <span class="text-[21px] font-bold tracking-[-0.04em] text-[#103f4c]">Clinic<span class="text-[#0ea5e9]">One</span></span>
      </a>
      <a routerLink="/login" class="text-sm font-semibold text-[#0b84bd] transition hover:text-[#075985] hover:underline">Cổng người bệnh</a>
    </header>

    <div class="flex flex-1 items-center px-6 pb-12 pt-4 sm:px-10 lg:px-14 lg:pb-20">
      <div class="w-full max-w-[430px]">
        <p class="text-xs font-bold uppercase tracking-[0.18em] text-[#0b91c9]">Đăng nhập nhân viên</p>
        <h1 class="mt-4 text-4xl font-bold tracking-[-0.06em] text-[#082d39] sm:text-5xl">Đăng nhập</h1>
        <div class="mt-8 h-px w-12 bg-[#0ea5e9]"></div>

        <form class="mt-8 grid gap-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <label class="grid gap-2 text-sm font-semibold text-[#244c58]">
            Tên đăng nhập
            <input formControlName="username" autocomplete="username" class="min-h-12 rounded-xl border border-[#c8d9de] bg-white px-4 font-normal text-[#103f4c] outline-none transition placeholder:text-[#8aa4ac] focus:border-[#0ea5e9] focus:ring-4 focus:ring-[#0ea5e9]/10" />
          </label>
          <label class="grid gap-2 text-sm font-semibold text-[#244c58]">
            Mật khẩu
            <input formControlName="password" type="password" autocomplete="current-password" class="min-h-12 rounded-xl border border-[#c8d9de] bg-white px-4 font-normal text-[#103f4c] outline-none transition placeholder:text-[#8aa4ac] focus:border-[#0ea5e9] focus:ring-4 focus:ring-[#0ea5e9]/10" />
          </label>
          @if (error()) {
            <p role="alert" class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error() }}</p>
          }
          <button data-testid="staff-login-submit" type="submit" class="mt-2 min-h-12 rounded-xl bg-[#0b3846] px-5 text-sm font-semibold text-white shadow-lg shadow-[#0b3846]/15 transition hover:-translate-y-0.5 hover:bg-[#082d39] disabled:cursor-not-allowed disabled:opacity-50" [disabled]="busy()">
            {{ busy() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
          </button>
        </form>
      </div>
    </div>
  </section>
</main>
