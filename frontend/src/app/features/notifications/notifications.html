<main class="min-h-screen bg-[#f7fafb] text-[#103f4c]">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex h-[72px] max-w-[1200px] items-center justify-between gap-8 px-5 lg:px-0">
      <a routerLink="/home" class="flex items-center gap-3" aria-label="ClinicOne, trang chủ">
        <img class="h-11 w-11 object-contain" src="clinicone-mark.png" alt="" aria-hidden="true" />
        <span class="text-[21px] font-bold tracking-[-0.04em]">Clinic<span class="text-[#0ea5e9]">One</span></span>
      </a>
      <nav class="hidden items-center gap-7 text-sm font-medium text-slate-600 lg:flex" aria-label="Điều hướng chính">
        <a routerLink="/home" class="hover:text-[#0ea5e9]">Trang chủ</a>
        <a routerLink="/about" class="hover:text-[#0ea5e9]">Giới thiệu</a>
        <a routerLink="/process" class="hover:text-[#0ea5e9]">Quy trình</a>
        <a routerLink="/common-issues" class="hover:text-[#0ea5e9]">Hướng dẫn</a>
        <a routerLink="/support" class="hover:text-[#0ea5e9]">Thắc mắc</a>
        <a routerLink="/contact" class="hover:text-[#0ea5e9]">Liên hệ</a>
      </nav>
      <div class="flex items-center gap-4">
        <a href="tel:1900000" class="hidden items-center gap-2 text-right sm:flex">
          <mat-icon class="!h-5 !w-5 !text-[19px] text-rose-500">phone_in_talk</mat-icon>
          <span class="hidden text-xs text-slate-500 xl:block"><strong class="block text-[#103f4c]">Tổng đài</strong><span class="font-semibold tracking-[0.08em] text-rose-500">1900000</span></span>
        </a>
        <app-account-menu />
      </div>
    </div>
  </header>

  <div class="mx-auto max-w-[1200px] px-5 py-8 lg:px-0 lg:py-10">
    <div class="flex items-center gap-3 text-sm"><a routerLink="/home" class="font-semibold text-[#103f4c] hover:text-[#0ea5e9]">Trang chủ</a><mat-icon class="!h-4 !w-4 !text-[16px] text-slate-400">chevron_right</mat-icon><span class="font-semibold text-[#0ea5e9]">Thông báo</span></div>

    <div class="mt-8 grid gap-8 lg:grid-cols-[230px_1fr] lg:gap-10">
      <aside class="border-b border-slate-200 pb-5 lg:border-b-0 lg:border-r lg:pb-0 lg:pr-6"><app-account-nav /></aside>

      <section class="min-w-0" aria-labelledby="notifications-title">
        <h1 id="notifications-title" class="text-2xl font-bold tracking-[-0.03em] text-slate-900">Thông báo</h1>
        <div class="mt-6 grid min-h-[330px] place-items-center rounded-[16px] border border-dashed border-slate-300 bg-slate-50 px-6 py-12 text-center">
          <div>
            <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-[#e8f8fc] text-[#0ea5e9]"><mat-icon>notifications_none</mat-icon></span>
            <h2 class="mt-4 text-lg font-semibold text-slate-800">Chưa có thông báo</h2>
            <p class="mt-1 text-sm text-slate-500">Thông báo về lịch khám sẽ hiển thị tại đây.</p>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>
