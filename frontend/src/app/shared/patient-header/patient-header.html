<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur-md shadow-xs" [class.print:hidden]="printHidden()">
  <div class="mx-auto grid h-16 w-full max-w-[1600px] grid-cols-[1fr_auto] items-center gap-3 px-4 sm:h-[72px] sm:px-6 2xl:grid-cols-[auto_minmax(0,1fr)_auto] 2xl:gap-8 2xl:px-8">
    <a routerLink="/home" class="flex min-w-0 shrink-0 items-center gap-2 sm:gap-3" aria-label="ClinicOne, trang chủ" (click)="closeMenu()">
      <img class="h-10 w-10 object-contain transition-transform duration-500 hover:scale-105" src="clinicone-mark-small.png" alt="" aria-hidden="true" />
      <span class="text-lg font-bold tracking-tight text-slate-900 sm:text-2xl">Clinic<span class="text-[#0284c7]">One</span></span>
    </a>

    <nav class="hidden min-w-0 items-center justify-center gap-3 whitespace-nowrap text-base font-medium text-slate-600 2xl:flex 2xl:gap-5" aria-label="Điều hướng chính">
      @for (link of publicLinks; track link.route) {
        <a
          [routerLink]="link.route"
          routerLinkActive="text-[#0284c7] font-semibold"
          [routerLinkActiveOptions]="{ exact: link.route === '/home' }"
          class="shrink-0 whitespace-nowrap transition-colors hover:text-[#0284c7]">
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex min-w-0 items-center justify-end gap-1.5 sm:gap-2 2xl:gap-3.5">
      <a href="tel:19000000" class="hidden shrink-0 items-center gap-2.5 whitespace-nowrap rounded-full border border-slate-200 bg-slate-50/80 px-3 py-1.5 transition hover:border-slate-300 2xl:flex">
        <mat-icon class="!h-4 !w-4 !text-[18px] text-rose-500">phone_in_talk</mat-icon>
        <span class="whitespace-nowrap text-sm font-medium text-slate-500"><strong class="font-bold text-slate-800">1900 0000</strong></span>
      </a>

      <app-account-menu [responsiveCompact]="true" />

      <button
        type="button"
        class="grid h-10 w-10 shrink-0 place-items-center rounded-lg border border-slate-200 text-slate-700 2xl:hidden"
        aria-label="Mở menu"
        [attr.aria-expanded]="mobileMenuOpen()"
        (click)="toggleMenu()">
        <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <nav class="border-t border-slate-200 bg-white px-4 py-3 sm:px-6 2xl:hidden" aria-label="Menu điều hướng">
      <div class="mx-auto flex w-full max-w-[1600px] flex-col gap-1 2xl:px-8">
        @for (link of publicLinks; track link.route) {
          <a
            [routerLink]="link.route"
            routerLinkActive="text-[#0284c7] font-semibold bg-sky-50"
            [routerLinkActiveOptions]="{ exact: link.route === '/home' }"
            class="rounded-md px-3 py-2.5 text-sm font-medium hover:bg-sky-50 transition-colors"
            (click)="closeMenu()">
            {{ link.label }}
          </a>
        }
      </div>
    </nav>
  }
</header>
