<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur-md shadow-xs" [class.print:hidden]="printHidden()">
  <div class="mx-auto flex h-[72px] max-w-[1200px] items-center justify-between gap-8 px-5 lg:px-0">
    <a routerLink="/home" class="flex items-center gap-3" aria-label="ClinicOne, trang chủ" (click)="closeMenu()">
      <img class="h-10 w-10 object-contain transition-transform duration-500 hover:scale-105" src="clinicone-mark-small.png" alt="" aria-hidden="true" />
      <span class="text-xl font-bold tracking-tight text-slate-900">Clinic<span class="text-[#0284c7]">One</span></span>
    </a>

    <nav class="hidden items-center gap-7 text-sm font-medium text-slate-600 lg:flex" aria-label="Điều hướng chính">
      @for (link of publicLinks; track link.route) {
        <a
          [routerLink]="link.route"
          routerLinkActive="text-[#0284c7] font-semibold"
          [routerLinkActiveOptions]="{ exact: link.route === '/home' }"
          class="transition-colors hover:text-[#0284c7]">
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-3.5">
      <a href="tel:1900000" class="hidden items-center gap-2.5 rounded-full border border-slate-200 bg-slate-50/80 px-3 py-1.5 transition hover:border-slate-300 sm:flex">
        <mat-icon class="!h-4 !w-4 !text-[18px] text-rose-500">phone_in_talk</mat-icon>
        <span class="text-xs text-slate-500 font-medium"><strong class="font-bold text-slate-800">1900000</strong></span>
      </a>

      <app-account-menu />

      <button
        type="button"
        class="grid h-10 w-10 place-items-center rounded-lg border border-slate-200 text-slate-700 lg:hidden"
        aria-label="Mở menu"
        [attr.aria-expanded]="mobileMenuOpen()"
        (click)="toggleMenu()">
        <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <nav class="border-t border-slate-200 bg-white px-5 py-4 lg:hidden" aria-label="Menu trên điện thoại">
      <div class="mx-auto flex max-w-[1200px] flex-col gap-1">
        @for (link of publicLinks; track link.route) {
          <a
            [routerLink]="link.route"
            routerLinkActive="text-[#0284c7] font-semibold bg-sky-50"
            [routerLinkActiveOptions]="{ exact: link.route === '/home' }"
            class="rounded-md px-3 py-2.5 text-sm font-medium hover:bg-sky-50 transition-colors"
            (click)="closeMenu()">
            {{ link.label }}
          </a>
        }
      </div>
    </nav>
  }
</header>
