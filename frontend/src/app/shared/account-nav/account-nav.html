<nav class="grid gap-1" aria-label="Menu tài khoản">
  @for (item of items; track item.route) {
    <a [routerLink]="item.route"
      routerLinkActive="border-[#0284c7] bg-sky-50 font-semibold text-[#0e3d48]"
      class="flex min-h-11 items-center gap-3 rounded-r-lg border-l-2 border-transparent px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 hover:text-[#0284c7]"
      [attr.data-testid]="'account-nav-' + item.route.slice(1).replace('/', '-')">
      <mat-icon class="!h-5 !w-5 !text-[20px]">{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
