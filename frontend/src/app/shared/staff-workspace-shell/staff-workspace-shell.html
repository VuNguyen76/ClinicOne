<main class="min-h-[100dvh] bg-[#eef2f3] text-[#173f4b]" data-testid="staff-workspace-shell">
  <header class="sticky top-0 z-40 h-14 border-b border-[#cbdadd] bg-[#f9fbfb]">
    <div class="flex h-full items-center">
      <button
        type="button"
        class="grid h-14 w-14 shrink-0 place-items-center border-r border-[#d5e1e4] text-[#0b617d] hover:bg-[#e8f3f6] lg:hidden"
        aria-label="Mở danh mục chức năng"
        [attr.aria-expanded]="navigationOpen()"
        (click)="toggleNavigation()"
      ><mat-icon>menu</mat-icon></button>
      <a [routerLink]="landingRoute" class="flex h-full w-[224px] shrink-0 items-center gap-2.5 border-r border-[#d5e1e4] px-4" aria-label="ClinicOne">
        <img class="h-8 w-8 object-contain" src="clinicone-mark.png" alt="" aria-hidden="true" />
        <span class="text-lg font-bold tracking-[-0.05em] text-[#0a303b]">Clinic<span class="text-[#0b91c9]">One</span></span>
      </a>
      <div class="hidden min-w-0 flex-1 items-center gap-3 px-4 md:flex">
        <span class="truncate text-sm font-semibold text-[#173f4b]">{{ moduleTitle() }}</span>
        <span class="h-5 w-px bg-[#d5e1e4]"></span>
        <label class="relative w-full max-w-md">
          <mat-icon class="pointer-events-none absolute left-2.5 top-1/2 !h-4 !w-4 -translate-y-1/2 !text-[17px] text-slate-400">search</mat-icon>
          <span class="sr-only">Tìm chức năng</span>
          <input
            type="search"
            class="h-9 w-full rounded-md border border-[#cbdadd] bg-white pl-8 pr-3 text-sm outline-none transition focus:border-[#0b91c9] focus:ring-2 focus:ring-[#0b91c9]/15"
            placeholder="Tìm chức năng..."
            [value]="functionQuery()"
            (input)="updateFunctionQuery($event)"
          />
        </label>
      </div>
      <div class="ml-auto flex items-center gap-3 px-3 sm:px-4">
        <span class="hidden text-xs font-medium text-slate-500 xl:inline">{{ roleLabel }}</span>
        <app-account-menu [compact]="true" />
      </div>
    </div>
  </header>

  <div class="lg:grid lg:grid-cols-[224px_minmax(0,1fr)]">
    @if (navigationOpen()) {
      <button type="button" class="fixed inset-0 z-30 bg-[#082d39]/35 lg:hidden" aria-label="Đóng danh mục chức năng" (click)="closeNavigation()"></button>
    }
    <aside
      class="fixed inset-y-14 left-0 z-30 w-[224px] overflow-y-auto border-r border-[#cbdadd] bg-[#f7f9fa] transition-transform lg:sticky lg:top-14 lg:h-[calc(100dvh-3.5rem)] lg:translate-x-0"
      [class.translate-x-0]="navigationOpen()"
      [class.-translate-x-full]="!navigationOpen()"
      data-testid="staff-module-nav"
    >
      <nav class="py-3" aria-label="Danh mục chức năng">
        @for (group of visibleNavigation(); track group.label) {
          <section class="mb-3">
            <h2 class="px-4 pb-1.5 text-[10px] font-bold uppercase tracking-[0.1em] text-slate-500">{{ group.label }}</h2>
            <div class="grid gap-0.5 px-2">
              @for (item of group.items; track item.route) {
                <a
                  [routerLink]="item.route"
                  routerLinkActive="bg-[#dff3f8] text-[#086b8b] shadow-[inset_3px_0_0_#0b91c9]"
                  [routerLinkActiveOptions]="{ exact: false }"
                  class="flex min-h-9 items-center gap-2.5 rounded-sm px-3 text-sm font-medium text-slate-700 transition hover:bg-[#e8f2f4] hover:text-[#0b617d]"
                  (click)="closeNavigation()"
                >
                  <mat-icon class="!h-5 !w-5 !text-[19px]">{{ item.icon }}</mat-icon>
                  <span>{{ item.label }}</span>
                </a>
              }
            </div>
          </section>
        }
      </nav>
    </aside>

    <section class="min-w-0">
      <header class="flex min-h-14 flex-wrap items-center justify-between gap-3 border-b border-[#cbdadd] bg-white px-4 py-2.5 lg:px-5">
        <div class="min-w-0">
          <p class="truncate text-[11px] font-medium text-slate-500">{{ moduleTitle() }}</p>
          <h1 class="truncate text-lg font-bold tracking-[-0.025em] text-[#0a303b]" data-testid="staff-window-title">{{ pageTitle() }}</h1>
        </div>
        <div class="flex items-center gap-2" data-testid="staff-window-actions">
          <ng-content select="[workspace-actions]" />
        </div>
      </header>
      <div class="p-3 sm:p-4 lg:p-5">
        <ng-content />
      </div>
    </section>
  </div>
</main>
