spring:
  application:
    name: ClinicOne
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  timezone: Asia/Ho_Chi_Minh
  address:
    api-root: ${ADDRESS_API_ROOT:https://tinhthanhpho.com/api/v1}
  clinic:
    unit-name: ${CLINIC_UNIT_NAME:ClinicOne}
    department-name: ${CLINIC_DEPARTMENT_NAME:Khám bệnh}
    hold-minutes: ${CLINIC_HOLD_MINUTES:10}
    cancellation-threshold-hours: ${CLINIC_CANCELLATION_THRESHOLD_HOURS:12}
    max-over-capacity-appointments-per-doctor-per-day: ${CLINIC_MAX_OVER_CAPACITY_APPOINTMENTS_PER_DOCTOR_PER_DAY:3}
    max-active-patient-profiles: ${CLINIC_MAX_ACTIVE_PATIENT_PROFILES:10}
