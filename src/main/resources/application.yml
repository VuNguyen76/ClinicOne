spring:
  application:
    name: ClinicOne
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  timezone: Asia/Ho_Chi_Minh
  address:
    api-root: ${ADDRESS_API_ROOT:https://tinhthanhpho.com/api/v1}
