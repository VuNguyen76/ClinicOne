spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: ClinicOne existing schema
app:
  otp:
    provider: ${OTP_PROVIDER:textbee}
