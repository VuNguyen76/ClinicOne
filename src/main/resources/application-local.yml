spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # The clinic database is remote; recycle and keep connections alive so a
      # server-side idle timeout cannot leave the pool handing out dead sockets.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:30000}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: ClinicOne existing schema
app:
  otp:
    provider: ${OTP_PROVIDER:textbee}
